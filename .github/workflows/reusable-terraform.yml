# Golden path infrastructure.
#
# Plan on the pull request, apply on merge, approval gate before prod.
# The point is that a developer never learns Terraform CLI flags, remote
# state layout, or which subscription they are allowed to touch.

name: Golden path Terraform

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      environment:
        description: dev | uat | prod
        required: true
        type: string
      working-directory:
        required: false
        default: infra
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Remote state naming is a platform decision, not a team decision.
      # One convention means we can find any service's state in an incident
      # without asking who built it.
      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ inputs.service-name }}/${{ inputs.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var-file="env/${{ inputs.environment }}.tfvars" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt

      # Reviewers should not have to open the Actions log to review infra.
      # Put the plan where the conversation already is.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working-directory }}/plan.txt', 'utf8');
            const body = [
              `#### Terraform plan — \`${{ inputs.service-name }}\` / \`${{ inputs.environment }}\``,
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... truncated, see run log' : plan,
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.service-name }}-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}/tfplan

  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    # Environment protection rules live in GitHub, not in YAML.
    # prod requires a named approver group; dev applies straight through.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.service-name }}-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ inputs.service-name }}/${{ inputs.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      # Apply the reviewed plan, not a fresh one. Otherwise the thing that
      # was approved and the thing that ran are not the same thing.
      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
